[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warpos"
version = "0.1.0"
description = "The open-source platform for AI agents. Write logic, deploy everything."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "click>=8.1.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
all = ["anthropic>=0.28.0"]

[project.scripts]
warp = "warpos.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["warpos"]
